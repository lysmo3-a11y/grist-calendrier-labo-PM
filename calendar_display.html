
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
:root{--navy:#0b2447;--teal:#00a6b2;--tealbg:#e3f5f6;--bg:#f4f6f9;--line:#d9e0ea;--txt:#1b2733;--mute:#6a7a8c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 Figtree,system-ui,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;color:var(--txt)}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;flex:none}
header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.logo{height:32px;display:block;background:#fff;padding:3px 8px;border-radius:6px}
.nav{display:flex;align-items:center;gap:6px;margin-left:12px}
.nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:4px 11px;cursor:pointer;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.22)}
#mt{min-width:220px;text-align:center;font-weight:600;font-size:16px}
#legend{margin-left:auto;display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:flex-end;max-height:44px;overflow:hidden}
.lg{display:flex;align-items:center;gap:5px;font-size:12px;color:#d6e0f0;white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:50%;display:block}

main{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column}
#cal{
 display:grid;
 grid-template-columns:repeat(7,minmax(0,1fr));
 grid-template-rows:34px repeat(3,minmax(0,1fr));
 flex:1;min-height:0;
 background:#fff;border:1px solid var(--line);
 border-radius:8px;overflow:hidden
}
.wd{display:flex;align-items:center;justify-content:center;background:#eef2f7;font-weight:600;font-size:13px;color:var(--navy);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.wd:nth-child(7){border-right:0}
.day{position:relative;min-height:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:#fff}
.day:nth-child(7n){border-right:0}
.day.today{background:#f1fafb}
.dn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;margin:5px;font-weight:600;font-size:15px;color:#46515e}
.today .dn{background:var(--teal);color:#fff;border-radius:50%}
.bday{position:absolute;top:8px;right:8px;font-size:18px;line-height:1;cursor:default}
.evs{position:absolute;top:40px;left:5px;right:5px;bottom:5px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.ev{position:relative;margin-bottom:6px;padding:7px 7px 8px 11px;border-radius:6px;cursor:pointer;background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ev:hover{box-shadow:0 2px 8px rgba(11,36,71,.18)}
.et{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ed{font-size:12px;color:var(--mute);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msg{display:none;margin:12px 12px 0;padding:10px 14px;background:#fde8ea;color:#c62f3a;border-radius:6px}

@media(max-width:800px){
 #legend{display:none}
 #mt{min-width:130px;font-size:13px}
 header{gap:7px;padding:0 8px}
 header h1{font-size:13px}
 .logo{height:27px}
 .nav{margin-left:2px;gap:3px}
 .nav button{padding:4px 7px}
 main{padding:5px}
 .ev{padding:5px 4px 5px 8px}
 .et{font-size:11px}
 .ed{font-size:10px}
}
</style>
</head>

<body>
<div id="app">
<header>
  <img src="logotypePFMP.png" alt="Lab logo" class="logo">
  <h1>Lab calendar</h1>
  <div class="nav">
    <button id="today">Today</button>
    <button id="prev" aria-label="Previous week">‹</button>
    <div id="mt"></div>
    <button id="next" aria-label="Next week">›</button>
  </div>
  <div id="legend"></div>
</header>
<div id="msg"></div>
<main><div id="cal"></div></main>
</div>

<script>
(function(){

const ZONE='Europe/Paris';
const $=s=>document.querySelector(s);

window.onerror=m=>{
 const x=$('#msg');
 if(x){
  x.style.display='block';
  x.textContent='Script error: '+m;
 }
};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
}[c]));

const toD=v=>{
 if(v==null||v==='')return null;
 const d=v instanceof Date?v:new Date(
  typeof v==='number'&&v<1e11?v*1000:v
 );
 return isNaN(d.getTime())?null:d;
};

/* Toutes les dates du calendrier sont normalisées en UTC */
const dayTs=d=>Date.UTC(
 d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()
);

const nowD=new Date();
const todayTs=Date.UTC(
 nowD.getFullYear(),nowD.getMonth(),nowD.getDate()
);

const leap=y=>y%4===0&&(y%100!==0||y%400===0);

let E=[];
let B=[];
 /* Date de départ du calendrier : lundi de cette semaine */
let cur=monday(new Date());

/* Lundi de la semaine contenant la date donnée */
function monday(d){
 const x=new Date(Date.UTC(
  d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()
 ));
 x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));
 return x;
}



/* Lecture des anniversaires */
function birthdayDate(v){
 if(v==null||v==='')return null;

 if(typeof v==='string'){
  const match=v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(match){
   return {
    m:Number(match[2])-1,
    d:Number(match[3])
   };
  }
 }

 const d=toD(v);
 if(!d)return null;

 return {
  m:d.getUTCMonth(),
  d:d.getUTCDate()
 };
}

grist.ready({
 requiredAccess:'full',
 columns:[
  {name:'Evenements',title:'Event',type:'Text'},
  {name:'Date_de_debut',title:'Start date',type:'Date'},
  {name:'Date_de_fin',title:'End date',type:'Date'},
  {name:'Starting_hour',title:'Start time',type:'DateTime',optional:true},
  {name:'All_day_',title:'All day',type:'Bool',optional:true},
  {name:'Lieu',title:'Place',type:'Text',optional:true},
  {name:'Categorie',title:'Category',type:'Choice',optional:true},
  {name:'Couleur',title:'Color (#RRGGBB)',type:'Text',optional:true},
  {name:'Duree',title:'Duration',type:'Text',optional:true}
 ]
});

function norm(r){
 const a=toD(r.Date_de_debut);
 if(!a)return null;

 const s=dayTs(a);
 const b=toD(r.Date_de_fin);
 const e=b?Math.max(s,dayTs(b)):s;
 const h=toD(r.Starting_hour);

 const rawColor=String(r.Couleur||'').trim();
 const col=/^#[0-9a-f]{6}$/i.test(rawColor)
  ?rawColor:'#00a6b2';

 return {
  id:r.id,
  title:r.Evenements||'Untitled event',
  s,e,
  allDay:!!r.All_day_,
  time:h?h.toLocaleTimeString('fr-FR',{
   hour:'2-digit',
   minute:'2-digit',
   timeZone:ZONE
  }):'',
  loc:r.Lieu||'',
  cat:r.Categorie||'',
  dur:r.Duree||'',
  col
 };
}

function birthdaysOn(ts){
 const d=new Date(ts);
 const m=d.getUTCMonth();
 const n=d.getUTCDate();
 const y=d.getUTCFullYear();

 return B.filter(b=>
  b.m===m&&(
   b.d===n||
   (b.m===1&&b.d===29&&n===28&&!leap(y))
  )
 ).map(b=>b.n);
}

/* Événements avec icônes */
function ev(e){
 let meta=[];

 if(e.allDay){
  meta.push('🕒 Toute la journée');
 }else if(e.time){
  meta.push('🕒 '+e.time);
 }

 if(e.loc)meta.push('📍 '+e.loc);
 if(e.dur)meta.push('⏳ '+e.dur);

 return `
 <div class="ev" data-id="${e.id}" style="--c:${e.col}"
 title="${esc([e.title,e.time,e.loc,e.cat,e.dur].filter(Boolean).join('\n'))}">
  <div class="et">${esc(e.title)}</div>
  ${meta.map(x=>`<div class="ed">${esc(x)}</div>`).join('')}
 </div>`;
}

function render(){

 const start=new Date(Date.UTC(
  cur.getUTCFullYear(),
  cur.getUTCMonth(),
  cur.getUTCDate()
 ));

 const end=new Date(start);
 end.setUTCDate(end.getUTCDate()+20);

 const fmt={timeZone:'UTC',day:'numeric',month:'short'};

 $('#mt').textContent=
  start.toLocaleDateString('fr-FR',fmt)
  +' – '+
  end.toLocaleDateString('fr-FR',{
   timeZone:'UTC',
   day:'numeric',
   month:'long',
   year:'numeric'
  });

 let h=[
  'Lun','Mar','Mer','Jeu','Ven','Sam','Dim'
 ].map(d=>`<div class="wd">${d}</div>`).join('');

 for(let i=0;i<21;i++){

  const d=new Date(start);
  d.setUTCDate(d.getUTCDate()+i);

  const ts=dayTs(d);
  const bd=birthdaysOn(ts);

  const events=E.filter(e=>e.s<=ts&&ts<=e.e)
   .sort((a,b)=>
    (a.allDay-b.allDay)||a.time.localeCompare(b.time)
   );

  h+=`
   <div class="day ${ts===todayTs?'today':''}">
    <div class="dn">${d.getUTCDate()}</div>
    ${bd.length
     ?`<span class="bday">🥳</span>`
     :''}
    <div class="evs">${events.map(ev).join('')}</div>
   </div>`;
 }

 $('#cal').innerHTML=h;

 /* Légende des catégories : conservée à l'identique */
 const cats=new Map();

 E.forEach(e=>{
  if(e.cat&&!cats.has(e.cat)){
   cats.set(e.cat,e.col);
  }
 });

 $('#legend').innerHTML=[...cats].map(([c,k])=>
  `<span class="lg"><i style="background:${k}"></i>${esc(c)}</span>`
 ).join('');
}

/* Chargement des anniversaires */
async function loadB(){
 try{
  const t=await grist.docApi.fetchTable('Birthdays');

  B=(t.id||[]).map((_,i)=>{
   const d=birthdayDate(t.Birth_Date[i]);
   const name=t.Name[i];

   return d&&name
    ?{n:name,m:d.m,d:d.d}
    :null;
  }).filter(Boolean);

 }catch(e){
  B=[];
 }

 render();
}

/* Chargement des événements */
grist.onRecords(recs=>{
 const r=grist.mapColumnNames(recs)||recs;
 E=r.map(norm).filter(Boolean);
 render();
 loadB();
});

/* Clic sur événement : sélection de la ligne Grist */
$('#cal').onclick=e=>{
 const x=e.target.closest('.ev');
 if(x){
  grist.setCursorPos({rowId:+x.dataset.id});
 }
};

/* Navigation par semaine */
$('#prev').onclick=()=>{
 cur.setUTCDate(cur.getUTCDate()-7);
 render();
};

$('#next').onclick=()=>{
 cur.setUTCDate(cur.getUTCDate()+7);
 render();
};

$('#today').onclick=()=>{
 cur=monday(new Date());
 render();
 loadB();
};

window.addEventListener('focus',loadB);

render();

})();
</script>
</body>
</html>
