<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
/* Palette as the inventory widget */
:root{--navy:#0b2447;--teal:#00a6b2;--tealbg:#e3f5f6;--bg:#f4f6f9;--line:#d9e0ea;--txt:#1b2733;--mute:#6a7a8c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 Figtree,system-ui,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;color:var(--txt)}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;flex:none}
header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.logo{height:32px;display:block;background:#fff;padding:3px 8px;border-radius:6px}
.nav{display:flex;align-items:center;gap:6px;margin-left:12px}
.nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:4px 11px;cursor:pointer;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.22)}
#mt{min-width:160px;text-align:center;font-weight:600;font-size:16px}
#legend{margin-left:auto;display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:flex-end;max-height:44px;overflow:hidden}
.lg{display:flex;align-items:center;gap:5px;font-size:12px;color:#d6e0f0;white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:50%;display:block}
main{flex:1;min-height:0;padding:12px}
#cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:34px repeat(var(--w,5),minmax(0,1fr));height:100%;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.wd{display:flex;align-items:center;justify-content:center;background:#eef2f7;font-weight:600;font-size:12.5px;color:var(--navy);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.wd:nth-child(7){border-right:0}
.day{position:relative;min-height:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:#fff}
.day:nth-child(7n){border-right:0}
.day.out{background:#f7f9fb}.day.out .dn{color:#aab5c2}
.day.today{background:#f1fafb}
.dn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;margin:4px;font-weight:600;font-size:13px;color:#46515e}
.today .dn{background:var(--teal);color:#fff;border-radius:13px}
.bday{position:absolute;top:3px;right:6px;font-size:17px;line-height:1;cursor:default}
.evs{position:absolute;top:34px;left:4px;right:4px;bottom:4px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.ev{position:relative;margin-bottom:4px;padding:4px 6px 5px 10px;border-radius:5px;cursor:pointer;background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ev:hover{box-shadow:0 2px 8px rgba(11,36,71,.18)}
.et{font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ed{font-size:11px;color:var(--mute);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msg{display:none;margin:12px 12px 0;padding:10px 14px;background:#fde8ea;color:#c62f3a;border-radius:6px}
@media(max-width:800px){#legend{display:none}#mt{min-width:120px;font-size:14px}}
</style></head>
<body><div id="app">
<header>
  <img src="logotypePFMP.png" alt="Lab logo" class="logo"><h1>Lab calendar</h1>
  <div class="nav"><button id="today">Today</button><button id="prev" aria-label="Previous month">‹</button><div id="mt"></div><button id="next" aria-label="Next month">›</button></div>
  <div id="legend"></div>
</header>
<div id="msg"></div>
<main><div id="cal"></div></main>
</div>
<script>
const ZONE='Europe/Paris',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):v;
/* Any Grist date/datetime value (seconds, ms or Date) -> Date */
const toD=v=>{if(v==null||v==='')return null;const d=v instanceof Date?v:new Date(typeof v==='number'&&v<1e11?v*1000:v);return isNaN(d)?null:d};
/* Calendar days are handled as UTC-midnight timestamps */
const dayTs=d=>Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
const nowD=new Date(),todayTs=Date.UTC(nowD.getFullYear(),nowD.getMonth(),nowD.getDate());
const leap=y=>y%4===0&&(y%100!==0||y%400===0);
let E=[],B=[],cur=new Date(nowD.getFullYear(),nowD.getMonth(),1);

grist.ready({requiredAccess:'full',columns:[
  {name:'Evenements',title:'Event',type:'Text'},
  {name:'Date_de_debut',title:'Start date',type:'Date'},
  {name:'Date_de_fin',title:'End date',type:'Date'},
  {name:'Starting_hour',title:'Start time',type:'DateTime',optional:true},
  {name:'All_day_',title:'All day',type:'Bool',optional:true},
  {name:'Lieu',title:'Place',type:'Text',optional:true},
  {name:'Categorie',title:'Category',type:'ChoiceList',optional:true},
  {name:'Couleur',title:'Color (#RRGGBB)',type:'Text',optional:true},
  {name:'Duree',title:'Duration',type:'Text',optional:true}]});

function norm(r){
  const a=toD(r.Date_de_debut);if(!a)return null;
  const s=dayTs(a),b=toD(r.Date_de_fin),e=b?Math.max(s,dayTs(b)):s;
  const h=toD(r.Starting_hour);
  const col=/^#[0-9a-f]{6}$/i.test((r.Couleur||'').trim())?r.Couleur.trim():'#00a6b2';
  return{id:r.id,title:r.Evenements||'Untitled event',s,e,allDay:!!r.All_day_,
    time:h?h.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:ZONE}):'',
    loc:r.Lieu||'',cat:[].concat(arr(r.Categorie)||[]).join(', '),dur:r.Duree||'',col};
}
function birthdaysOn(ts){
  const d=new Date(ts),m=d.getUTCMonth(),n=d.getUTCDate(),y=d.getUTCFullYear();
  return B.filter(b=>b.m===m&&(b.d===n||(b.m===1&&b.d===29&&n===28&&!leap(y)))).map(b=>b.n);
}
function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  $('#mt').textContent=cur.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),weeks=Math.ceil((off+dim)/7);
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const ts=Date.UTC(y,m,1-off+i),d=new Date(ts),out=d.getUTCMonth()!==m;
    const bd=birthdaysOn(ts);
    h+=`<div class="day ${out?'out':''} ${ts===todayTs?'today':''}"><div class="dn">${d.getUTCDate()}</div>`+
      (bd.length?`<span class="bday" title="Birthday: ${esc(bd.join(', '))}">🥳</span>`:'')+
      '<div class="evs">'+E.filter(e=>e.s<=ts&&ts<=e.e).sort((a,b)=>(a.allDay-b.allDay)||a.time.localeCompare(b.time)).map(ev).join('')+'</div></div>';
  }
  $('#cal').style.setProperty('--w',weeks);$('#cal').innerHTML=h;
  const cats=new Map();E.forEach(e=>{if(e.cat&&!cats.has(e.cat))cats.set(e.cat,e.col)});
  $('#legend').innerHTML=[...cats].map(([c,k])=>`<span class="lg"><i style="background:${k}"></i>${esc(c)}</span>`).join('');
}
function ev(e){
  const t=e.allDay?'All day':e.time;
  const meta=[t,e.loc,e.cat].filter(Boolean).join(' · ');
  return `<div class="ev" data-id="${e.id}" style="--c:${e.col}" title="${esc([e.title,t,e.loc,e.cat,e.dur].filter(Boolean).join('\n'))}"><div class="et">${esc(e.title)}</div>${meta?`<div class="ed">${esc(meta)}</div>`:''}</div>`;
}
async function loadB(){
  try{
    const t=await grist.docApi.fetchTable('Birthdays');
    B=(t.id||[]).map((_,i)=>{const d=toD(t.Birth_Date[i]);return d&&t.Name[i]?{n:t.Name[i],m:d.getUTCMonth(),d:d.getUTCDate()}:null}).filter(Boolean);
  }catch(e){B=[]}   // no Birthdays table yet: calendar still works
  render();
}
grist.onRecords(recs=>{
  const r=grist.mapColumnNames(recs);
  if(!r){$('#msg').style.display='block';$('#msg').textContent='Map the Event, Start date and End date columns in the widget settings.';return}
  $('#msg').style.display='none';
  E=r.map(norm).filter(Boolean);render();loadB();
});
$('#cal').onclick=e=>{const x=e.target.closest('.ev');if(x)grist.setCursorPos({rowId:+x.dataset.id})};
$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$('#today').onclick=()=>{cur=new Date(nowD.getFullYear(),nowD.getMonth(),1);render();loadB()};
window.addEventListener('focus',loadB);
render();
</script></body></html>
