
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
:root{
  --navy:#0b2447;
  --teal:#00a6b2;
  --tealbg:#e3f5f6;
  --bg:#f4f6f9;
  --line:#d9e0ea;
  --txt:#1b2733;
  --mute:#6a7a8c;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;
  font:14px/1.4 Figtree,system-ui,sans-serif;
  color:var(--txt);background:var(--bg)
}
button{font:inherit;color:var(--txt)}
#app{display:flex;flex-direction:column;height:100%}

header{
  background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:14px;
  padding:0 16px;height:48px;flex:none
}
header h1{
  font-size:15px;font-weight:600;
  margin:0;white-space:nowrap
}
.logo{
  height:32px;display:block;background:#fff;
  padding:3px 8px;border-radius:6px
}
.nav{
  display:flex;align-items:center;gap:6px;margin-left:12px
}
.nav button{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.28);
  color:#fff;border-radius:6px;
  padding:4px 11px;cursor:pointer;font-weight:600
}
.nav button:hover{background:rgba(255,255,255,.22)}
#mt{
  min-width:230px;text-align:center;
  font-weight:600;font-size:15px
}
#legend{
  margin-left:auto;display:flex;gap:4px 14px;
  flex-wrap:wrap;justify-content:flex-end;
  max-height:44px;overflow:hidden
}
.lg{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:#d6e0f0;white-space:nowrap
}
.lg i{
  width:9px;height:9px;border-radius:50%;display:block
}

main{
  flex:1;min-height:0;padding:12px;
  display:flex;flex-direction:column
}
#cal{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:34px repeat(3,minmax(0,1fr));
  flex:1;min-height:0;
  background:#fff;border:1px solid var(--line);
  border-radius:8px;overflow:hidden
}
.wd{
  display:flex;align-items:center;justify-content:center;
  background:#eef2f7;font-weight:600;
  font-size:13px;color:var(--navy);
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line)
}
.wd:nth-child(7){border-right:0}

.day{
  position:relative;min-height:0;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  overflow:hidden;background:#fff
}
.day:nth-child(7n){border-right:0}
.day.today{background:#f1fafb}

.dn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:29px;height:29px;margin:5px;
  font-weight:600;font-size:15px;color:#46515e
}
.today .dn{
  background:var(--teal);color:#fff;border-radius:50%
}
.bday{
  position:absolute;top:8px;right:9px;
  font-size:18px;line-height:1;cursor:default
}
.evs{
  position:absolute;top:40px;left:6px;right:6px;bottom:5px;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin
}
.ev{
  position:relative;margin-bottom:6px;
  padding:7px 8px 8px 12px;
  border-radius:6px;cursor:pointer;
  background:color-mix(in srgb,var(--c) 13%,#fff);
  border:1px solid color-mix(in srgb,var(--c) 22%,#fff);
  overflow:hidden
}
.ev::before{
  content:"";position:absolute;left:0;top:0;bottom:0;
  width:4px;background:var(--c)
}
.ev:hover{box-shadow:0 2px 8px rgba(11,36,71,.18)}
.et{
  font-size:13px;font-weight:700;line-height:1.3;
  margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden
}
.meta{
  display:flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--mute);
  line-height:1.5;min-width:0
}
.meta span{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.meta svg{flex:none;width:13px;height:13px;opacity:.8}
.meta-sep{
  width:3px;height:3px;border-radius:50%;
  background:var(--mute);flex:none;opacity:.5
}
#msg{
  display:none;margin:12px 12px 0;padding:10px 14px;
  background:#fde8ea;color:#c62f3a;border-radius:6px
}

@media(max-width:800px){
  #legend{display:none}
  #mt{min-width:140px;font-size:13px}
  header{gap:7px;padding:0 8px}
  header h1{font-size:13px}
  .logo{height:27px}
  .nav{margin-left:2px;gap:3px}
  .nav button{padding:4px 7px}
  main{padding:6px}
  .evs{left:3px;right:3px}
  .ev{padding:5px 4px 6px 8px}
  .et{font-size:11px}
  .meta{font-size:10px}
}
</style>
</head>

<body>
<div id="app">
<header>
  <img src="logotypePFMP.png" alt="Lab logo" class="logo">
  <h1>Lab calendar</h1>

  <div class="nav">
    <button id="today">Today</button>
    <button id="prev" aria-label="Previous week">‹</button>
    <div id="mt"></div>
    <button id="next" aria-label="Next week">›</button>
  </div>

  <div id="legend"></div>
</header>

<div id="msg"></div>
<main><div id="cal"></div></main>
</div>

<script>
const ZONE='Europe/Paris';
const $=s=>document.querySelector(s);

window.onerror=m=>{
  const x=$('#msg');
  if(x){x.style.display='block';x.textContent='Script error: '+m}
};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
}[c]));

const arr=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):v;

const toD=v=>{
  if(v==null||v==='')return null;
  const d=v instanceof Date?v:new Date(
    typeof v==='number'&&v<1e11?v*1000:v
  );
  return isNaN(d)?null:d;
};

const dayTs=d=>Date.UTC(
  d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()
);

const nowD=new Date();
const todayTs=Date.UTC(
  nowD.getFullYear(),nowD.getMonth(),nowD.getDate()
);

const leap=y=>y%4===0&&(y%100!==0||y%400===0);

let E=[],B=[];

// Toujours commencer le lundi de la semaine actuelle.
function mondayOf(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const dow=(x.getDay()+6)%7;
  x.setDate(x.getDate()-dow);
  return x;
}

let cur=mondayOf(nowD);

grist.ready({
  requiredAccess:'full',
  columns:[
    {name:'Evenements',title:'Event',type:'Text'},
    {name:'Date_de_debut',title:'Start date',type:'Date'},
    {name:'Date_de_fin',title:'End date',type:'Date'},
    {name:'Starting_hour',title:'Start time',type:'DateTime',optional:true},
    {name:'All_day_',title:'All day',type:'Bool',optional:true},
    {name:'Lieu',title:'Place',type:'Text',optional:true},
    {name:'Categorie',title:'Category',type:'ChoiceList',optional:true},
    {name:'Couleur',title:'Color (#RRGGBB)',type:'Text',optional:true},
    {name:'Duree',title:'Duration',type:'Text',optional:true}
  ]
});

function norm(r){
  const a=toD(r.Date_de_debut);
  if(!a)return null;

  const s=dayTs(a);
  const b=toD(r.Date_de_fin);
  const e=b?Math.max(s,dayTs(b)):s;
  const h=toD(r.Starting_hour);

  const col=/^#[0-9a-f]{6}$/i.test((r.Couleur||'').trim())
    ?r.Couleur.trim():'#00a6b2';

  return{
    id:r.id,
    title:r.Evenements||'Untitled event',
    s,e,
    allDay:!!r.All_day_,
    time:h?h.toLocaleTimeString('fr-FR',{
      hour:'2-digit',minute:'2-digit',timeZone:ZONE
    }):'',
    loc:r.Lieu||'',
    cat:[].concat(arr(r.Categorie)||[]).join(', '),
    dur:r.Duree||'',
    col
  };
}

function birthdaysOn(ts){
  const d=new Date(ts);
  const m=d.getUTCMonth(),n=d.getUTCDate(),y=d.getUTCFullYear();

  return B.filter(b=>
    b.m===m&&(
      b.d===n||
      (b.m===1&&b.d===29&&n===28&&!leap(y))
    )
  ).map(b=>b.n);
}

// Icônes SVG intégrées, sans dépendance externe.
const icons={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
  hourglass:'<path d="M6 2h12M6 22h12M7 2v4a5 5 0 0 0 2 4l3 2-3 2a5 5 0 0 0-2 4v4M17 2v4a5 5 0 0 1-2 4l-3 2 3 2a5 5 0 0 1 2 4v4"/>'
};

function ico(name){
  return `<svg viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round">
    ${icons[name]}
  </svg>`;
}

function ev(e){
  const meta=[];

  if(e.allDay){
    meta.push(`<div class="meta">${ico('clock')}<span>All day</span></div>`);
  }else if(e.time){
    meta.push(`<div class="meta">${ico('clock')}<span>${esc(e.time)}</span></div>`);
  }

  if(e.loc){
    meta.push(`<div class="meta">${ico('pin')}<span>${esc(e.loc)}</span></div>`);
  }

  if(e.dur){
    meta.push(`<div class="meta">${ico('hourglass')}<span>${esc(e.dur)}</span></div>`);
  }

  return `
    <div class="ev" data-id="${e.id}" style="--c:${e.col}"
      title="${esc([e.title,e.time,e.loc,e.dur,e.cat].filter(Boolean).join('\n'))}">
      <div class="et">${esc(e.title)}</div>
      ${meta.join('')}
    </div>`;
}

function render(){
  const start=new Date(cur);
  const end=new Date(cur);
  end.setDate(end.getDate()+20);

  const fmt={day:'numeric',month:'short'};

  const dateStart=start.toLocaleDateString('fr-FR',fmt);
  const dateEnd=end.toLocaleDateString('fr-FR',{
    day:'numeric',month:'long',year:'numeric'
  });

  $('#mt').textContent=`${dateStart} – ${dateEnd}`;

  let h=[
    'Lun','Mar','Mer','Jeu','Ven','Sam','Dim'
  ].map(d=>`<div class="wd">${d}</div>`).join('');

  for(let i=0;i<21;i++){
    const d=new Date(cur);
    d.setDate(d.getDate()+i);

    const ts=dayTs(d);
    const bd=birthdaysOn(ts);

    const events=E
      .filter(e=>e.s<=ts&&ts<=e.e)
      .sort((a,b)=>
        (a.allDay-b.allDay)||a.time.localeCompare(b.time)
      );

    h+=`
      <div class="day ${ts===todayTs?'today':''}">
        <div class="dn">${d.getDate()}</div>
        ${bd.length
          ?`<span class="bday" title="Birthday: ${esc(bd.join(', '))}">🥳</span>`
          :''}
        <div class="evs">${events.map(ev).join('')}</div>
      </div>`;
  }

  $('#cal').innerHTML=h;

  const cats=new Map();
  E.forEach(e=>{
    if(e.cat&&!cats.has(e.cat))cats.set(e.cat,e.col);
  });

  $('#legend').innerHTML=[...cats].map(([c,k])=>
    `<span class="lg"><i style="background:${k}"></i>${esc(c)}</span>`
  ).join('');
}

async function loadB(){
  try{
    const t=await grist.docApi.fetchTable('Birthdays');
    B=(t.id||[]).map((_,i)=>{
      const d=toD(t.Birth_Date[i]);
      return d&&t.Name[i]
        ?{n:t.Name[i],m:d.getUTCMonth(),d:d.getUTCDate()}
        :null;
    }).filter(Boolean);
  }catch(e){
    B=[];
  }
  render();
}

grist.onRecords(recs=>{
  const r=grist.mapColumnNames(recs)||recs;
  E=r.map(norm).filter(Boolean);
  render();
  loadB();
});

$('#cal').onclick=e=>{
  const x=e.target.closest('.ev');
  if(x)grist.setCursorPos({rowId:+x.dataset.id});
};

$('#prev').onclick=()=>{
  cur=new Date(cur);
  cur.setDate(cur.getDate()-7);
  render();
};

$('#next').onclick=()=>{
  cur=new Date(cur);
  cur.setDate(cur.getDate()+7);
  render();
};

$('#today').onclick=()=>{
  cur=mondayOf(new Date());
  render();
  loadB();
};

window.addEventListener('focus',loadB);

render();
</script>
</body>
</html>

function birthdaysOn(ts){
  const d=new Date(ts);
  const m=d.getUTCMonth(),n=d.getUTCDate(),y=d.getUTCFullYear();

  return B.filter(b=>
    b.m===m&&(
      b.d===n||
      (b.m===1&&b.d===29&&n===28&&!leap(y))
    )
  ).map(b=>b.n);
}

// Icônes SVG intégrées, sans dépendance externe.
const icons={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
  hourglass:'<path d="M6 2h12M6 22h12M7 2v4a5 5 0 0 0 2 4l3 2-3 2a5 5 0 0 0-2 4v4M17 2v4a5 5 0 0 1-2 4l-3 2 3 2a5 5 0 0 1 2 4v4"/>'
};

function ico(name){
  return `<svg viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round">
    ${icons[name]}
  </svg>`;
}

function ev(e){
  const meta=[];

  if(e.allDay){
    meta.push(`<div class="meta">${ico('clock')}<span>All day</span></div>`);
  }else if(e.time){
    meta.push(`<div class="meta">${ico('clock')}<span>${esc(e.time)}</span></div>`);
  }

  if(e.loc){
    meta.push(`<div class="meta">${ico('pin')}<span>${esc(e.loc)}</span></div>`);
  }

  if(e.dur){
    meta.push(`<div class="meta">${ico('hourglass')}<span>${esc(e.dur)}</span></div>`);
  }

  return `
    <div class="ev" data-id="${e.id}" style="--c:${e.col}"
      title="${esc([e.title,e.time,e.loc,e.dur,e.cat].filter(Boolean).join('\n'))}">
      <div class="et">${esc(e.title)}</div>
      ${meta.join('')}
    </div>`;
}

function render(){
  const start=new Date(cur);
  const end=new Date(cur);
  end.setDate(end.getDate()+20);

  const fmt={day:'numeric',month:'short'};

  const dateStart=start.toLocaleDateString('fr-FR',fmt);
  const dateEnd=end.toLocaleDateString('fr-FR',{
    day:'numeric',month:'long',year:'numeric'
  });

  $('#mt').textContent=`${dateStart} – ${dateEnd}`;

  let h=[
    'Lun','Mar','Mer','Jeu','Ven','Sam','Dim'
  ].map(d=>`<div class="wd">${d}</div>`).join('');

  for(let i=0;i<21;i++){
    const d=new Date(cur);
    d.setDate(d.getDate()+i);

    const ts=dayTs(d);
    const bd=birthdaysOn(ts);

    const events=E
      .filter(e=>e.s<=ts&&ts<=e.e)
      .sort((a,b)=>
        (a.allDay-b.allDay)||a.time.localeCompare(b.time)
      );

    h+=`
      <div class="day ${ts===todayTs?'today':''}">
        <div class="dn">${d.getDate()}</div>
        ${bd.length
          ?`<span class="bday" title="Birthday: ${esc(bd.join(', '))}">🥳</span>`
          :''}
        <div class="evs">${events.map(ev).join('')}</div>
      </div>`;
  }

  $('#cal').innerHTML=h;

  const cats=new Map();
  E.forEach(e=>{
    if(e.cat&&!cats.has(e.cat))cats.set(e.cat,e.col);
  });

  $('#legend').innerHTML=[...cats].map(([c,k])=>
    `<span class="lg"><i style="background:${k}"></i>${esc(c)}</span>`
  ).join('');
}

async function loadB(){
  try{
    const t=await grist.docApi.fetchTable('Birthdays');
    B=(t.id||[]).map((_,i)=>{
      const d=toD(t.Birth_Date[i]);
      return d&&t.Name[i]
        ?{n:t.Name[i],m:d.getUTCMonth(),d:d.getUTCDate()}
        :null;
    }).filter(Boolean);
  }catch(e){
    B=[];
  }
  render();
}

grist.onRecords(recs=>{
  const r=grist.mapColumnNames(recs)||recs;
  E=r.map(norm).filter(Boolean);
  render();
  loadB();
});

$('#cal').onclick=e=>{
  const x=e.target.closest('.ev');
  if(x)grist.setCursorPos({rowId:+x.dataset.id});
};

$('#prev').onclick=()=>{
  cur=new Date(cur);
  cur.setDate(cur.getDate()-7);
  render();
};

$('#next').onclick=()=>{
  cur=new Date(cur);
  cur.setDate(cur.getDate()+7);
  render();
};

$('#today').onclick=()=>{
  cur=mondayOf(new Date());
  render();
  loadB();
};

window.addEventListener('focus',loadB);

render();
</script>
</body>
</html>
